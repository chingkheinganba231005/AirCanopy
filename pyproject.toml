[project]
name = "aircanopy"
version = "0.1.0"
description = "Plant trees virtually anywhere and simulate, in 3D, how they change street-level heat and air pollution."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chingkheinganba Rajkumar" }]
requires-python = ">=3.12"
dependencies = [
  "jax==0.11.2",
  "mapbox-earcut>=1.0",
  "numpy>=2.1,<3",
  "pyarrow>=25",
  "pyproj>=3.6",
  "rasterio>=1.5",
  "scikit-image>=0.25",
  "scipy>=1.17",
  "shapely>=2.0",
  "trimesh>=4.4",
]

[project.scripts]
aircanopy = "aircanopy.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aircanopy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aircanopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: needs internet access; skipped unless AIRCANOPY_NETWORK_TESTS=1",
  "slow: takes more than a few seconds",
]
